<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Naming Events: ML Analysis Explorer</title>
  <style>
    :root { --bg:#f4f2ed; --panel:#fff; --ink:#191919; --muted:#686868; --line:#d8d3c9; --accent:#1f5f8b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font-family:Inter, Segoe UI, Arial, sans-serif; }
    .login { width:min(420px, calc(100vw - 32px)); border:1px solid var(--line); border-radius:10px; background:var(--panel); padding:22px; box-shadow:0 18px 60px rgba(0,0,0,.12); }
    h1 { margin:0 0 16px; font-size:20px; letter-spacing:0; }
    form { display:grid; gap:10px; }
    label { font-size:12px; color:#4e4b47; font-weight:800; text-transform:uppercase; letter-spacing:.04em; }
    input { width:100%; border:1px solid var(--line); border-radius:7px; padding:10px 11px; font-size:14px; color:var(--ink); background:#fff; }
    button { border:0; border-radius:7px; background:#191919; color:#fff; min-height:38px; padding:0 14px; font-weight:800; cursor:pointer; }
    button:disabled { opacity:.55; cursor:default; }
    .meta { margin-top:12px; color:var(--muted); font-size:12px; min-height:18px; }
    .progress { height:8px; border-radius:999px; background:#e2ddd3; overflow:hidden; margin-top:12px; }
    .bar { height:100%; width:0%; background:#191919; transition:width .15s ease; }
    .error { color:#9b2418; }
  </style>
</head>
<body>
  <main class="login">
    <h1>Naming Events: ML Analysis Explorer</h1>
    <form id="gate">
      <label for="passphrase">Password</label>
      <input id="passphrase" name="passphrase" type="password" autocomplete="current-password" autofocus>
      <button id="unlock" type="submit">Unlock</button>
    </form>
    <div class="progress" aria-hidden="true"><div id="bar" class="bar"></div></div>
    <div id="meta" class="meta"></div>
  </main>
  <script>
  (() => {
    const CONFIG_URL = 'naming_locked/config.json';
    const basePath = 'naming_locked/';
    const SESSION_KEY = 'namingExplorerSessionPassphrase';
    const form = document.getElementById('gate');
    const passInput = document.getElementById('passphrase');
    const button = document.getElementById('unlock');
    const bar = document.getElementById('bar');
    const meta = document.getElementById('meta');
    const decoder = new TextDecoder();
    const encoder = new TextEncoder();
    const blobUrls = [];

    function setProgress(pct, text, isError=false) {
      bar.style.width = Math.max(0, Math.min(100, pct)) + '%';
      meta.textContent = text || '';
      meta.classList.toggle('error', !!isError);
    }
    function rememberedPassphrase() {
      try { return sessionStorage.getItem(SESSION_KEY) || ''; }
      catch (_) { return ''; }
    }
    function rememberPassphrase(passphrase) {
      try { sessionStorage.setItem(SESSION_KEY, passphrase); }
      catch (_) {}
    }
    function forgetPassphrase() {
      try { sessionStorage.removeItem(SESSION_KEY); }
      catch (_) {}
    }
    function b64ToBytes(s) {
      const raw = atob(s);
      const out = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
      return out;
    }
    async function deriveKey(passphrase, config) {
      const material = await crypto.subtle.importKey('raw', encoder.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name:'PBKDF2', hash:'SHA-256', salt:b64ToBytes(config.salt), iterations:config.iterations },
        material,
        { name:'AES-GCM', length:256 },
        false,
        ['decrypt']
      );
    }
    async function decryptUrl(key, url) {
      const response = await fetch(url, { cache:'no-store' });
      if (!response.ok) throw new Error('Missing encrypted payload');
      const bytes = new Uint8Array(await response.arrayBuffer());
      const iv = bytes.slice(0, 12);
      const cipher = bytes.slice(12);
      return crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, cipher);
    }
    async function decryptJson(key, url) {
      return JSON.parse(decoder.decode(await decryptUrl(key, url)));
    }
    function escapeRegExp(text) {
      return String(text).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }
    function patchHtml(html, assetUrlByPath) {
      html = html.replace(/<head>`n\s*/i, '<head>\n');
      const oldBase = 'naming' + '_' + 'assets/';
      const oldBasePattern = new RegExp('<base\\s+href=["\\\']' + oldBase.replace('/', '\\/') + '["\\\']\\s*>\\s*', 'i');
      html = html.replace(oldBasePattern, '');
      const dataAsset = ['interactive', 'embeddings.js'].join('_');
      const appAsset = ['chart', 'browser', 'interactive.js'].join('_');
      const dataUrl = assetUrlByPath.get(dataAsset);
      const appUrl = assetUrlByPath.get(appAsset);
      const dataPattern = new RegExp('fetchTextWithProgress\\("' + escapeRegExp(dataAsset) + '\\?v="\\s*\\+\\s*cacheTag\\)', 'g');
      const appPattern = new RegExp('loadScript\\("' + escapeRegExp(appAsset) + '\\?v="\\s*\\+\\s*cacheTag\\)', 'g');
      if (dataUrl) html = html.replace(dataPattern, 'fetchTextWithProgress(' + JSON.stringify(dataUrl) + ')');
      if (appUrl) html = html.replace(appPattern, 'loadScript(' + JSON.stringify(appUrl) + ')');
      html = html.replace(/(<script\b(?=[^>]*\bid=["']assets-json["'])(?=[^>]*\btype=["']application\/json["'])[^>]*>)([\s\S]*?)(<\/script>)/i, (m, open, jsonText, close) => {
        const assets = JSON.parse(jsonText);
        for (const asset of assets) if (asset && assetUrlByPath.has(asset.path)) asset.path = assetUrlByPath.get(asset.path);
        return open + JSON.stringify(assets).replace(/</g, '\\u003c') + close;
      });
      return html;
    }
    async function unlock(passphrase) {
      if (!window.crypto || !crypto.subtle) throw new Error('This browser does not support WebCrypto.');
      setProgress(4, 'Loading encrypted package');
      const config = await fetch(CONFIG_URL, { cache:'no-store' }).then(r => {
        if (!r.ok) throw new Error('Missing password package.');
        return r.json();
      });
      setProgress(10, 'Checking password');
      const key = await deriveKey(passphrase, config);
      let manifest;
      try {
        manifest = await decryptJson(key, basePath + config.manifest);
      } catch (_) {
        throw new Error('Incorrect password.');
      }
      rememberPassphrase(passphrase);
      setProgress(14, 'Decrypting page');
      const html = decoder.decode(await decryptUrl(key, basePath + manifest.html.file));
      const assetUrlByPath = new Map();
      const totalBytes = manifest.assets.reduce((a, x) => a + (x.size || 0), 0) || manifest.assets.length;
      let doneBytes = 0;
      for (let i = 0; i < manifest.assets.length; i++) {
        const asset = manifest.assets[i];
        const plain = await decryptUrl(key, basePath + asset.file);
        const blobUrl = URL.createObjectURL(new Blob([plain], { type:asset.mime || 'application/octet-stream' }));
        blobUrls.push(blobUrl);
        assetUrlByPath.set(asset.path, blobUrl);
        doneBytes += asset.size || 1;
        const pct = 14 + Math.min(76, Math.round(doneBytes / totalBytes * 76));
        setProgress(pct, 'Decrypting assets');
      }
      setProgress(94, 'Starting explorer');
      const patched = patchHtml(html, assetUrlByPath);
      document.open();
      document.write(patched);
      document.close();
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      passInput.disabled = true;
      setProgress(1, 'Unlocking');
      try {
        await unlock(passInput.value);
      } catch (err) {
        forgetPassphrase();
        button.disabled = false;
        passInput.disabled = false;
        passInput.select();
        setProgress(0, err && err.message ? err.message : 'Unable to unlock.', true);
      }
    });
    const saved = rememberedPassphrase();
    if (saved) {
      button.disabled = true;
      passInput.disabled = true;
      setProgress(1, 'Unlocking');
      unlock(saved).catch(err => {
        forgetPassphrase();
        button.disabled = false;
        passInput.disabled = false;
        passInput.value = '';
        setProgress(0, err && err.message ? err.message : 'Unable to unlock.', true);
      });
    }
  })();
  </script>
</body>
</html>
